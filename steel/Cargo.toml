[package]
name = "steel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Internal crates
steel-core.workspace = true
steel-login.workspace = true
steel-utils.workspace = true
steel-protocol.workspace = true
steel-registry.workspace = true
steel-extension-api = { workspace = true, features = ["host"] }

# Async runtime
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-std", "fs", "signal"] }
tokio-util.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
toml.workspace = true
serde_json.workspace = true

# Concurrency
parking_lot = { workspace = true, features = [
    "deadlock_detection",
], optional = true }


# Logging
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
crossterm = { version = "0.29.0", features = ["osc52"] }
chrono.workspace = true

# Cryptography
text_components.workspace = true
sha1.workspace = true
hex.workspace = true
uuid.workspace = true

# Networking
reqwest.workspace = true
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

# Memory
mimalloc = { version = "0.1.52", optional = true }

# Profiling
dhat = { version = "0.3.3", optional = true }
strip-ansi-escapes = "0.2.1"

[lints]
workspace = true

[features]
default = ["mimalloc"]
stand-alone = []
deadlock_detection = ["dep:parking_lot"]
dhat-heap = ["dhat"]
mimalloc = ["dep:mimalloc"]
slow_chunk_gen = ["steel-core/slow_chunk_gen"]
tls-native = ["reqwest/native-tls-vendored"]
jaeger = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
